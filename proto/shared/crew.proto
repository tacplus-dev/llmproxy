}

// Report — the dogs' formal, auditable channel to SeaBeam, and the ONLY one
// (A27). Lands on the company record; SeaBeam answers on the same record.
// TODO(Q23): SeaBeam reads a stripped projection with no message text through
// one fleet-level ops service; neither the projection nor that service exists.
// TODO(DQ31): a report from a personal (Scotty) run lands in the person's
// private record instead; that private type is not declared here.
// RETENTION: LOG (2 years).
message Report {
  option (spec.record) = {
    key: "report_id"
    owner: "spiffe_id"
    s2s: {auth_services: ["beagle", "otto", "tally"]}
    s2s_subscribe: {auth_services: ["stratum"]}
    residency: {idle_seconds: 604800}
  };

  string report_id = 1 [(spec.assert_required) = true, (spec.assert_min_size) = 1, (spec.assert_max_size) = 128];
  ReportClass report_class = 2 [(spec.assert_enum_defined) = true];
  string dog = 3 [(spec.assert_required) = true, (spec.assert_max_size) = 64];
  string run_id = 4 [(spec.assert_max_size) = 128];
  repeated string tool_outcome_ids = 5 [(spec.assert_max_size) = 32, (spec.assert_element_max_size) = 600];
  // words is the dog's own account.
  string words = 6 [(spec.assert_max_size) = 4000];
  // answer is SeaBeam's reply, written back on the same record.
  string answer = 7 [(spec.assert_max_size) = 4000];
  int64 filed_at_ms = 8 [(spec.assert_ge) = 0];
  int64 version = 9 [(spec.assert_ge) = 0];

  string namespace = 10 [(spec.store_namespace) = true, (spec.assert_max_size) = 256];
  string spiffe_id = 11 [(spec.identity_spiffe_subject) = true, (spec.assert_max_size) = 1024];

  // store_epoch_ms is the row's LAST-WRITE clock, stamped by the generated
  // subscription dispatch, so it is never producer-supplied.
  int64 store_epoch_ms = 12 [
    (spec.store_epoch) = true,
    (spec.query_field) = {op: QUERY_OP_RANGE}
  ];
}
