// ============================================================================
// 5. Observability: ToolCallOutcome (A26) and Report (A27)
// ============================================================================

enum ToolOutcomeClass {
  TOOL_OUTCOME_CLASS_UNSPECIFIED = 0;
  TOOL_OUTCOME_CLASS_OK = 1;
  TOOL_OUTCOME_CLASS_PARSE = 2;            // arguments did not parse (A25)
  TOOL_OUTCOME_CLASS_VALIDATION = 3;       // parsed, failed validation (A25)
  TOOL_OUTCOME_CLASS_REFUSED = 4;          // authorization / manifest / device gate
  TOOL_OUTCOME_CLASS_UNKNOWN_OUTCOME = 5;  // external effect, ack lost (A1)
}

// ToolCallOutcome — one per tool call, written by the runtime (A26). It
// carries no arguments and no text, only classes and ids, so it can never hold
// a person<->Scotty conversation (never logged, Jody 2026-09-29). Weekly
// rollup per dog x tool x class; a recurring failure becomes an eval case.
// RETENTION: LOG (2 years).
message ToolCallOutcome {
  option (spec.record) = {
    key: "outcome_id"
    owner: "spiffe_id"
    s2s: {auth_services: ["beagle", "otto", "tally"]}
    s2s_subscribe: {auth_services: ["stratum"]}
    mutability: MUTABILITY_APPEND_ONLY
    residency: {idle_seconds: 86400}
  };

  string outcome_id = 1 [(spec.assert_required) = true, (spec.assert_min_size) = 1, (spec.assert_max_size) = 600];
  string dog = 2 [(spec.assert_required) = true, (spec.assert_max_size) = 64, (spec.query_field) = {op: QUERY_OP_EQ}];
  // persona_version is PersonaDefinition.version_hash at the time.
  string persona_version = 3 [(spec.assert_max_size) = 64];
  string model = 4 [(spec.assert_max_size) = 128];
  string tool = 5 [(spec.assert_max_size) = 256, (spec.query_field) = {op: QUERY_OP_EQ}];
  ToolOutcomeClass outcome = 6 [(spec.assert_enum_defined) = true];
  // error_path is the JSON path tacplus reports for a parse/validation error
  // (ask T8).
  string error_path = 7 [(spec.assert_max_size) = 1000];
  string run_id = 8 [(spec.assert_max_size) = 128];
  int64 at_ms = 9 [(spec.query_field) = {op: QUERY_OP_RANGE}];

  string namespace = 10 [
    (spec.store_namespace) = true,
    (spec.query_field) = {op: QUERY_OP_EQ},
    (spec.assert_max_size) = 256
  ];
  string spiffe_id = 11 [(spec.identity_spiffe_subject) = true, (spec.assert_max_size) = 1024];

  // store_epoch_ms is the row's LAST-WRITE clock, stamped by the generated
  // subscription dispatch, so it is never producer-supplied.
  int64 store_epoch_ms = 12 [
    (spec.store_epoch) = true,
    (spec.query_field) = {op: QUERY_OP_RANGE}
  ];
}

// LogbookEntry — the company logbook line (contract §6; design §6): one per
// mutating tool call, written by the runtime, never by the model. It carries
// ids and a one-line summary, never message text, so a person<->Scotty
// conversation never lands here (Jody, 2026-09-29).
// TODO(design §6): PersonalLogbookEntry (Scotty's private copy, P8/S3) and
// Reveille's actor-stripped projection (A19) are not declared yet.
// RETENTION: LOG (2 years).
message LogbookEntry {
  option (spec.record) = {
    // "<instance_key>/<event_seq>/<tool>/<id of what the act produced>".
    key: "entry_id"
    owner: "spiffe_id"
    s2s: {auth_services: ["scotty", "beagle", "otto", "tally"]}
    s2s_subscribe: {auth_services: ["stratum"]}
    mutability: MUTABILITY_APPEND_ONLY
    residency: {idle_seconds: 86400}
  };

  string entry_id = 1 [(spec.assert_required) = true, (spec.assert_min_size) = 1, (spec.assert_max_size) = 1200];
  string instance_key = 2 [(spec.assert_required) = true, (spec.assert_max_size) = 512, (spec.query_field) = {op: QUERY_OP_EQ}];
  // dog is the persona name that acted.
  string dog = 3 [(spec.assert_required) = true, (spec.assert_max_size) = 64];
  // persona_version is PersonaDefinition.version_hash at the time.
  string persona_version = 4 [(spec.assert_max_size) = 64];
  string tool = 5 [(spec.assert_required) = true, (spec.assert_max_size) = 256];
  // thread_id the act was taken in (A29).
  string thread_id = 6 [(spec.assert_max_size) = 128];
  // event_seq is the instance seq of the event the act answered.
  int64 event_seq = 7 [(spec.assert_ge) = 0];
  // referenced: the room, record or event the act touched or answered.
  repeated Ref referenced = 8 [(spec.assert_max_size) = 16];
  // summary is one line, written by the runtime from ids, never from text.
  string summary = 9 [(spec.assert_max_size) = 500];
  int64 at_ms = 10 [(spec.assert_ge) = 0, (spec.query_field) = {op: QUERY_OP_RANGE}];

  string namespace = 11 [
    (spec.store_namespace) = true,
    (spec.query_field) = {op: QUERY_OP_EQ},
    (spec.assert_max_size) = 256
  ];
  string spiffe_id = 12 [(spec.identity_spiffe_subject) = true, (spec.assert_max_size) = 1024];

  // store_epoch_ms is the row's LAST-WRITE clock, stamped by the generated
  // subscription dispatch, so it is never producer-supplied.
  int64 store_epoch_ms = 13 [
    (spec.store_epoch) = true,
    (spec.query_field) = {op: QUERY_OP_RANGE}
  ];
}

// MeteringRun — one model run, one session turn, as llmproxy charged it
// (pricing addendum 2026-10-10: cost is runs, not dogs). Written by the
// runtime from the turn's llmproxy Usage, never by a person or a model. Read
// per tenant and per seat, by trigger, against the tenant's budget
// (CompanyStructure.budget_micro_usd) by Scotty's GetMetering.
// Cache rate is cache_read_input_tokens / (input_tokens + cache_read_input_tokens).
// RETENTION: OPERATIONAL.
message MeteringRun {
  option (spec.record) = {
    // "<instance_key>/<turn_id>".
    key: "run_id"
    owner: "spiffe_id"
    s2s: {auth_services: ["scotty"]}
    s2s_subscribe: {auth_services: ["stratum"]}
    s2s_read: {auth_services: ["scotty"]}
    mutability: MUTABILITY_APPEND_ONLY
    residency: {idle_seconds: 86400}
  };

  string run_id = 1 [(spec.assert_required) = true, (spec.assert_min_size) = 1, (spec.assert_max_size) = 700];
  // dog is the persona name that ran.
  string dog = 2 [(spec.assert_required) = true, (spec.assert_max_size) = 64];
  // seat is the person whose event started the run (CrewEvent.actor).
  string seat = 3 [(spec.assert_max_size) = 256];
  // trigger is what started the run (CrewEvent.source).
  EventSource trigger = 4 [(spec.assert_enum_defined) = true];
  BudgetBucket bucket = 5 [(spec.assert_enum_defined) = true];
  // model_alias is the tier the run used.
  string model_alias = 6 [(spec.assert_max_size) = 64];
  int64 input_tokens = 7 [(spec.assert_ge) = 0];
  int64 output_tokens = 8 [(spec.assert_ge) = 0];
  int64 cache_read_input_tokens = 9 [(spec.assert_ge) = 0];
  int64 cost_micro_usd = 10 [(spec.assert_ge) = 0];
  // budget_exhausted: llmproxy stopped the turn at its own ceiling.
  bool budget_exhausted = 11;
  int64 at_ms = 12 [(spec.assert_ge) = 0, (spec.query_field) = {op: QUERY_OP_RANGE}];

  string namespace = 13 [
    (spec.store_namespace) = true,
    (spec.query_field) = {op: QUERY_OP_EQ},
    (spec.assert_max_size) = 256
  ];
  string spiffe_id = 14 [(spec.identity_spiffe_subject) = true, (spec.assert_max_size) = 1024];

  // store_epoch_ms is the row's LAST-WRITE clock, stamped by the generated
  // subscription dispatch, so it is never producer-supplied.
  int64 store_epoch_ms = 15 [
    (spec.store_epoch) = true,
    (spec.query_field) = {op: QUERY_OP_RANGE}
  ];
}

enum ReportClass {
  REPORT_CLASS_UNSPECIFIED = 0;
  REPORT_CLASS_CANNOT_DO = 1;
  REPORT_CLASS_CONTRADICTION_IN_ORDERS = 2;
  REPORT_CLASS_SUSPECTED_INJECTION = 3;
  REPORT_CLASS_REPEATED_FAILURE = 4;
  REPORT_CLASS_BUDGET = 5;
