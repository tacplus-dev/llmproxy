// Kennel — whether one company dog is loose or kenneled in one tenant
// (P-2026-10-09-2; skipper-and-admiral-2026-10-11; design record
// decisions/crew-product-pitch-2026-10-09.md §7.3, where it was drafted as
// DogLeash). One row per dog per tenant, so letting one dog loose never
// rewrites another's row. Absence is the dog's starting state: Barry starts
// loose, every other dog starts kenneled. The Skipper came with the ship and
// Scotty is the coach, not crew: neither has a row, and the writer refuses one.
// A kenneled dog keeps its records; let loose again, it resumes. Written only
// as the effect of an approved let-loose or kennel (the thumb); a tenant
// setting the dog reads, not topology.
// TODO(next slice): scotty's thumb-gated let-loose/kennel action publishes it;
// until then nothing writes a row and every tenant is in its starting state.
// RETENTION: OPERATIONAL.
message Kennel {
  option (spec.record) = {
    key: "kennel_id"
    owner: "spiffe_id"
    s2s: {auth_services: ["scotty"]}
    s2s_subscribe: {auth_services: ["stratum"]}
    s2s_read: {auth_services: ["scotty"]}
    residency: {idle_seconds: 604800}
  };

  // kennel_id is "<namespace>/<dog>", dog lower-case ("sarge").
  string kennel_id = 1 [(spec.assert_required) = true, (spec.assert_min_size) = 1, (spec.assert_max_size) = 330];
  // dog is the persona name as people say it ("Sarge").
  string dog = 2 [(spec.assert_required) = true, (spec.assert_max_size) = 64];
  // loose: true = let loose, false = in the kennel.
  bool loose = 3;
  // changed_by is the person whose thumb approved the change, by name, on the
  // record.
  string changed_by = 4 [(spec.assert_required) = true, (spec.assert_max_size) = 1024];
  // ticket_id is the approved Proposal (scotty.Ticket).
  string ticket_id = 5 [(spec.assert_max_size) = 128];
  int64 changed_at_ms = 6 [(spec.assert_ge) = 0];

  string namespace = 7 [
    (spec.store_namespace) = true,
    (spec.query_field) = {op: QUERY_OP_EQ},
    (spec.assert_max_size) = 256
  ];
  string spiffe_id = 8 [(spec.identity_spiffe_subject) = true, (spec.assert_max_size) = 1024];

  // store_epoch_ms is the row's LAST-WRITE clock, stamped by the generated
  // subscription dispatch, so it is never producer-supplied.
  int64 store_epoch_ms = 9 [
    (spec.store_epoch) = true,
    (spec.query_field) = {op: QUERY_OP_RANGE}
  ];
}

// ============================================================================
// Workspaces (projects/workspaces.md; design record
// decisions/workspaces-mvp-2026-10-11.md)
// ============================================================================
//
// A workspace is a room with a thing in the middle: people and dogs, the
// conversation, and an artifact that lives in the customer's Google Docs or
// Microsoft 365, plus the reasoning behind it. Six records, all tenant-owned,
// all here beside Kennel because dogs own and read them as well as people.
// For MVP scotty is the only writer; each dog joins auth_services in the change
// that declares its service. scotty reads all but WorkspaceTransfer back for
// the customer web app's ListWorkspaces and GetWorkspace.
// RETENTION: WORKSPACE (as long as the workspace; a new class, design record
// §1). Talk in the workspace's room is CHAT; only a promoted WorkspaceNote
// survives with the workspace.

enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_PERSON = 1;
  PRINCIPAL_KIND_DOG = 2;
}

// Principal is a person or a dog: who owns, belongs to, or acted on a
// workspace.
message Principal {
  PrincipalKind kind = 1 [(spec.assert_enum_defined) = true];
  // name is the person's principal for PERSON, the persona name as people say
  // it ("Reveille") for DOG.
  string name = 2 [(spec.assert_required) = true, (spec.assert_max_size) = 1024];
  // display_name is a PERSON's name, filled in by Scotty's workspace reads
  // from the tenant's Humans (identity_links). Never stored: empty on a row,
  // for a dog, and when no single Human links the principal.
  string display_name = 3 [(spec.assert_max_size) = 200];
}

// Workspace — one per workspace. owner is the current owner, a person or a
// company dog; each move is a WorkspaceTransfer.
message Workspace {
  option (spec.record) = {
    key: "workspace_id"
    owner: "spiffe_id"
    s2s: {auth_services: ["scotty"]}
    s2s_subscribe: {auth_services: ["stratum"]}
    s2s_read: {auth_services: ["scotty"]}
  };

  // workspace_id is "<namespace>/ws-<32 hex>".
  string workspace_id = 1 [(spec.assert_required) = true, (spec.assert_min_size) = 1, (spec.assert_max_size) = 300];
  string title = 2 [(spec.assert_required) = true, (spec.assert_max_size) = 256];
  Principal owner = 3 [(spec.assert_required) = true];
  // opened_by is who opened it, person or dog.
  Principal opened_by = 4 [(spec.assert_required) = true];
  // origin_room and origin_thread_id are the conversation it came from.
  Ref origin_room = 5;
  string origin_thread_id = 6 [(spec.assert_max_size) = 64];
  int64 opened_at_ms = 7 [(spec.assert_ge) = 0];

  string namespace = 8 [
    (spec.store_namespace) = true,
    (spec.query_field) = {op: QUERY_OP_EQ},
    (spec.assert_max_size) = 256
  ];
  string spiffe_id = 9 [(spec.identity_spiffe_subject) = true, (spec.assert_max_size) = 1024];

  // store_epoch_ms is the row's LAST-WRITE clock, stamped by the generated
  // subscription dispatch, so it is never producer-supplied.
  int64 store_epoch_ms = 10 [
    (spec.store_epoch) = true,
    (spec.query_field) = {op: QUERY_OP_RANGE}
  ];
}

