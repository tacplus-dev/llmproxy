name: release

# On a version tag vX.Y.Z: run the gates on the tag, publish ghcr.io/tacplus-dev/llmproxy:X.Y.Z for linux/amd64
# and linux/arm64, move the line tag X.Y when this is the line's highest release (ci/release-tags.sh), and
# create the GitHub release with the commits since the previous release (ci/release-notes.sh). A pre-release
# (vX.Y.Z-rc.N) publishes only its own tag. Fleets pin X.Y (tacplus-dev/tacplus#180).
#
# workflow_dispatch is a dry run: it tags HEAD locally as the given version, builds both architectures and
# prints the image tags and notes that release would get, and publishes nothing.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to dry-run, e.g. v0.1.1 (nothing is published)"
        required: true

permissions:
  contents: read

# One release at a time, so of two tags on one line the later run sees the other before it moves X.Y.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
  # The launcher every service image runs under (Dockerfile), built from source at this commit.
  LAUNCHER_COMMIT: d130eab7fcb42413fe0d2bdf5543e4edc23f9747

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag: the line tag and the notes depend on the releases already made.
          fetch-depth: 0
      - name: Tags and notes
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if [[ $DRY_RUN == true ]]; then
            if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
              echo "$VERSION is already released"; exit 1
            fi
            git tag "$VERSION"
          fi
          tags="$(ci/release-tags.sh "$VERSION")"
          ci/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          # The GitHub release marked Latest is the highest release, never a patch on an older line.
          flag=--latest=false
          if [[ "$VERSION" == *-* ]]; then
            flag=--prerelease
          elif [[ "$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -t. -k1.2,1n -k2,2n -k3,3n | tail -1)" == "$VERSION" ]]; then
            flag=--latest
          fi
          { echo "tags=$tags"; echo "flag=$flag"; } >> "$GITHUB_OUTPUT"
          echo "image tags: $(for t in $tags; do printf '%s:%s ' "$IMAGE" "$t"; done)"
          echo "release: $flag"
          cat "$RUNNER_TEMP/notes.md"
      - run: ci/tacplus.sh build
      - name: llmproxy, both architectures
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu protobuf-compiler
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
          rustup default stable
          cargo build --release --locked --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu
      - uses: actions/checkout@v4
        with:
          repository: tacplus-dev/launcher
          ref: ${{ env.LAUNCHER_COMMIT }}
          path: target/launcher-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: target/launcher-src/go.mod
          cache: false
      - name: launcher, both architectures
        working-directory: target/launcher-src
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "../launcher/launcher-linux-$arch" .
          done
      # The Dockerfile's apt-get runs on each target architecture.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.DRY_RUN != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image
        run: |
          tags=""
          [[ $DRY_RUN == true ]] || tags="${{ steps.plan.outputs.tags }}"
          # shellcheck disable=SC2086 # the tags are words
          ci/release-image.sh "${VERSION#v}" "$GITHUB_SHA" $tags
          [[ $DRY_RUN == true ]] || docker buildx imagetools inspect "$IMAGE:${VERSION#v}"
      - name: GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" ${{ steps.plan.outputs.flag }}
