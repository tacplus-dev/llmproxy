# Accepted security findings (tacplus-dev/looper README, Security checks). Each entry is dated: renew or remove it.
#
# #56: four unmaintained crates (cargo-deny and osv-scanner, UNKNOWN, not vulnerabilities) that only tacplus'
# generated Rust chassis pulls into Cargo.lock. Their owner is tacplus: the generator replaces them in
# tacplus-dev/tacplus#308, #319 and #320, and this repository drops them by moving tacplus.lock to the 2.6 patch
# that ships those fixes and re-resolving Cargo.lock; that commit removes these entries. They expire on 2027-02-10.
exceptions:
